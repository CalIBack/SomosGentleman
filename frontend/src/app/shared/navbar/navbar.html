<header class="navbar">
  <div class="navbar-container">
    
    <!-- Logotipo clickeable (Home) -->
    <a routerLink="/" class="logo">
      <div class="logo-text">
        <span class="somos">SOMOS</span>
        <span class="gentleman">GENTLEMAN<sup class="reg">&reg;</sup></span>
      </div>
    </a>

    <!-- Enlaces de navegación pública -->
    <nav class="nav-links">
      <a routerLink="/productos" routerLinkActive="active">Productos</a>
      <a routerLink="/contacto" [queryParams]="{ tipo: 'sastreria_medida' }" routerLinkActive="active">Sastrería a Medida</a>
      <a routerLink="/lookbooks" routerLinkActive="active">Lookbooks</a>
    </nav>

    <!-- Acciones (Usuario / Carrito) -->
    <div class="nav-actions">
      
      <!-- Contenedor del menú de usuario -->
      <div class="user-menu-container">
        <button class="action-btn" [class.logueado]="auth.estaLogueado()">
          <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" fill="none"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
        </button>
        
        <!-- Dropdown: cambia según haya sesión iniciada o no -->
        <div class="dropdown-menu">

          <ng-container *ngIf="auth.estaLogueado(); else sinSesion">
            <span class="dropdown-user">{{ auth.usuario()?.nombre }}</span>
            <hr>
            <a routerLink="/perfil">Mi Perfil</a>
            <a routerLink="/pedidos">Mis Pedidos</a>
            <a routerLink="/mis-lookbooks">Mis Lookbooks</a>
            <a routerLink="/admin" *ngIf="auth.esAdmin()">Panel Admin</a>
            <hr>
            <a class="logout" (click)="cerrarSesion()">Cerrar Sesión</a>
          </ng-container>

          <ng-template #sinSesion>
            <a routerLink="/login">Ingresar</a>
            <a routerLink="/login" [queryParams]="{ modo: 'registrar' }">Crear cuenta</a>
          </ng-template>

        </div>
      </div>

      <button class="action-btn cart-btn">
        <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" fill="none"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
      </button>

    </div>
  </div>
</header>
